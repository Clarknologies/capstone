version: "2"
sql:
  - engine: "postgresql"
    queries: "database/queries"
    schema: "database/migrations"
    gen:
      go:
        package: "database"
        out: "database/models"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_sql_as_comment: true
        overrides:
          - column: "events.metadata"
            go_type:
              type: "map[string]any"
